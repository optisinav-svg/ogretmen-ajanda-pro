name: period-stale-fix
on:
  push:
    branches: [period-stale-fix]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: period-stale-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix period screen state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('screens/AnaSayfa.js')
          s=p.read_text(encoding='utf-8')
          old="const donemSec=async d=>{setSecilenDonem(d);setDonemModal(false);try{await AsyncStorage.setItem(DONEM_KEY,JSON.stringify(d));await siniflariDonemeGoreYukle(d.yil)}catch(e){}};"
          new="const donemSec=async d=>{setSecilenDonem(d);setDonemModal(false);try{await AsyncStorage.setItem(DONEM_KEY,JSON.stringify(d));await siniflariDonemeGoreYukle(d.yil);navigation.reset({index:0,routes:[{name:'AnaSayfa',params:{donemYili:d.yil}}]})}catch(e){}};"
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate Android export
        run: |
          npm ci
          npx expo export --platform android
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/period-stale-fix.yml
          git add screens/AnaSayfa.js .github/workflows/period-stale-fix.yml
          git commit -m "Fix period change stale navigation state"
          git push origin period-stale-fix
