name: Firestore Rules Tests

on:
  push:
    branches:
      - security/firestore-rules
  pull_request:
    branches:
      - security/firestore-rules

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install project and test tools
        run: |
          npm install
          npm install --no-save firebase-tools @firebase/rules-unit-testing
      - name: Run Firestore rules tests in emulator
        run: npx firebase emulators:exec --only firestore --project demo-ogretmen-ajanda-rules "node --test tests/firestore.rules.test.js"
