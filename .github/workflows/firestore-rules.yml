name: Firestore Rules Tests

on:
  push:
    branches:
      - security/firestore-rules-final
  pull_request:
    branches:
      - feature/kitap-tanimlama

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install isolated Firestore test tools
        run: npm install --prefix /tmp/firestore-test-env firebase firebase-tools @firebase/rules-unit-testing
      - name: Run Firestore rules tests in emulator
        env:
          NODE_PATH: /tmp/firestore-test-env/node_modules
        run: /tmp/firestore-test-env/node_modules/.bin/firebase emulators:exec --only firestore --project demo-ogretmen-ajanda-rules "NODE_PATH=/tmp/firestore-test-env/node_modules node --test tests/firestore.rules.test.js"
