name: Normalize status style once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path('screens/OdevEkrani.js')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"statusValue:\{[^}]*\}","statusValue:{width:'50%',textAlign:'center'}",s,count=1)
          print('replacements',n)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-status-style2.yml').unlink(missing_ok=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','screens/OdevEkrani.js','.github/workflows/fix-status-style2.yml'],check=True)
          subprocess.run(['git','commit','-m','Normalize homework status column style'],check=True)
          subprocess.run(['git','push'],check=True)
      - name: Check
        run: grep -o "statusValue:{[^}]*}" screens/OdevEkrani.js | head -1
