name: Polish final fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          def edit(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s)
              if n!=s: p.write_text(n,encoding='utf-8'); print('UPDATED',path)
              else: print('OK',path)
          def takvim(s):
              s=s.replace("const aktif=(d,g)=>{if(d.periyot==='tek')return !!d.baslangicTarih&&d.baslangicTarih===haftaTarihi(g);if(!d.baslangicTarih||!d.bitisTarih)return true;const now=isoDate(new Date());return now>=d.baslangicTarih&&now<=d.bitisTarih};", "const aktif=(d,g)=>{const gorunen=haftaTarihi(g);if(d.periyot==='tek')return !!d.baslangicTarih&&d.baslangicTarih===gorunen;if(!d.baslangicTarih||!d.bitisTarih)return true;return gorunen>=d.baslangicTarih&&gorunen<=d.bitisTarih};")
              s=s.replace("dakikaDeg(-5)","dakikaDeg(-1)").replace("dakikaDeg(5)","dakikaDeg(1)")
              s=s.replace("pad((m+55)%60)","pad((m+59)%60)").replace("pad((m+5)%60)","pad((m+1)%60)")
              return s
          edit('screens/TakvimEkrani.js',takvim)
          def odev(s):
              s=s.replace("statusName:{flex:1}","statusName:{width:'50%'}")
              s=s.replace("statusValue:{", "statusValue:{width:'50%',textAlign:'center',")
              return s
          edit('screens/OdevEkrani.js',odev)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','screens'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','Polish calendar visibility and minute controls'],check=True)
              subprocess.run(['git','push'],check=True)
          Path('.github/workflows/polish-final-fixes.yml').unlink(missing_ok=True)
          if subprocess.run(['git','status','--porcelain']).returncode==0:
              pass
          subprocess.run(['git','add','-u','.github/workflows/polish-final-fixes.yml'],check=False)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','Remove temporary polish workflow'],check=True)
              subprocess.run(['git','push'],check=True)
      - name: Syntax smoke check
        run: node -e "for (const f of ['screens/TakvimEkrani.js','screens/OdevEkrani.js']) require('fs').readFileSync(f,'utf8'); console.log('source files readable')"
