name: Build tablet preview APK

on:
  push:
    branches:
      - work/section11-tablet-apk
  workflow_dispatch:

concurrency:
  group: tablet-preview-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Verify Expo access token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub repository secret EXPO_TOKEN is missing. Add the Expo access token for the configured EAS project."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Build internal Android APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json | tee eas-build.json
      - name: Publish EAS build URL
        if: success()
        run: |
          node -e "const fs=require('fs'); const raw=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const list=Array.isArray(raw)?raw:(raw.builds||[raw]); const build=list.find(x=>x.artifacts&&x.artifacts.buildUrl)||list[0]; const url=build?.artifacts?.buildUrl||build?.buildUrl; if(!url) throw new Error('EAS did not return an APK URL'); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Tablet preview APK: '+url+'\n'); console.log('APK URL: '+url);"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-preview-apk-build-metadata
          path: eas-build.json
          if-no-files-found: ignore
          retention-days: 7
