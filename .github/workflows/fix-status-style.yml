name: Fix status style once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and commit
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p=Path('screens/OdevEkrani.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("statusValue:{width:'50%',textAlign:'center',width:'50%',textAlign:'center',width:'50%',textAlign:'center'}","statusValue:{width:'50%',textAlign:'center'}")
          s=s.replace("statusValue:{width:'50%',textAlign:'center',width:'50%',textAlign:'center'}","statusValue:{width:'50%',textAlign:'center'}")
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-status-style.yml').unlink(missing_ok=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','screens/OdevEkrani.js','.github/workflows/fix-status-style.yml'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode!=0:
              subprocess.run(['git','commit','-m','Fix homework status column width'],check=True)
              subprocess.run(['git','push'],check=True)
      - name: Validate
        run: node -e "const s=require('fs').readFileSync('screens/OdevEkrani.js','utf8'); if(!s.includes(\"statusValue:{width:'50%',textAlign:'center'}\")) process.exit(1); console.log('status style OK')"
