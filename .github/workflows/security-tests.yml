name: Firestore and account security tests

on:
  push:
    branches:
      - feature/group2-ders-konu-takvim
  pull_request:
    branches:
      - feature/group2-ders-konu-takvim

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firestore test dependencies
        run: npm install --no-save firebase@11 @firebase/rules-unit-testing@4
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Run Firestore Emulator rules tests
        run: firebase emulators:exec --only firestore --project demo-ogretmen-ajanda-rules "node --test tests/firestore.rules.test.js"
      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions
      - name: Check Cloud Functions JavaScript syntax
        run: node --check functions/index.js && node --check functions/accountLinks.js && node --check functions/scripts/firestore-backup.js
      - name: Run Cloud Functions policy tests
        run: npm test --prefix functions

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android --output-dir .expo-ci-check
