name: Firestore and account security tests

on:
  push:
    branches:
      - feature/group2-ders-konu-takvim
      - feature/group3-firestore-security-hardening
      - feature/group4-student-app
      - integration/pre-apk-2026-11-21
      - release/pre-apk-2026-11-22
      - fix/spark-retention-and-apk-readiness-2026-11-22
  pull_request:
    branches:
      - work/section5-homework-attendance-reports
      - feature/group2-ders-konu-takvim
      - integration/pre-apk-2026-11-21
      - feature/group3-firestore-security-hardening
      - feature/group4-student-app
      - release/pre-apk-2026-11-22
      - fix/spark-retention-and-apk-readiness-2026-11-22

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firestore test dependencies
        run: |
          npm ci
          npm install --no-save firebase@11 @firebase/rules-unit-testing@4
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Run Firestore Emulator rules tests
        run: firebase emulators:exec --only firestore --project demo-ogretmen-ajanda-rules "node --test tests/*.test.js"
      - name: Install Cloud Functions dependencies
        run: npm install --prefix functions
      - name: Check Cloud Functions JavaScript syntax
        run: node --check functions/index.js && node --check functions/profileRegistration.js && node --check functions/accountLinks.js && node --check functions/studentNotifications.js && node --check functions/ownerStatistics.js && node --check functions/scripts/firestore-backup.js && node --check functions/scripts/configure-existing-accounts.js && node --check functions/scripts/migrate-missing-periods-2026.js
      - name: Run Cloud Functions policy tests
        run: npm test --prefix functions

      - name: Validate Android JavaScript bundle
        run: npx expo export --platform android --output-dir .expo-ci-check
