name: Apply reported AjandaPro fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply requested AjandaPro fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Rapor: make each book progress bar use the book's total page count as 100%.
          p = Path('screens/RaporEkrani.js')
          s = p.read_text(encoding='utf-8')
          old = " const kitapGruplari=id=>{const odevlerKitap=studentBookHomework(id);const gruplar={};odevlerKitap.forEach(o=>{const key=o.kitapId||o.kitapAd||'Kitap';if(!gruplar[key])gruplar[key]={kitapId:o.kitapId||key,kitapAd:o.kitapAd||'Kitap',items:[]};gruplar[key].items.push(o)});return Object.values(gruplar).sort((a,b)=>zaman(a.items[0]?.olusturulma)-zaman(b.items[0]?.olusturulma));};"
          new = " const kitapGruplari=id=>{const odevlerKitap=studentBookHomework(id),ogrenciKitaplari=kitaplar.filter(k=>k.ogrenciId===id);const gruplar={};ogrenciKitaplari.forEach(k=>{gruplar[k.id]={kitapId:k.id,kitapAd:k.ad||'Kitap',totalSayfa:parseInt(k.sayfaSayisi,10)||0,items:[]}});odevlerKitap.forEach(o=>{const key=o.kitapId||o.kitapAd||'Kitap';if(!gruplar[key])gruplar[key]={kitapId:o.kitapId||key,kitapAd:o.kitapAd||'Kitap',totalSayfa:0,items:[]};gruplar[key].items.push(o)});Object.values(gruplar).forEach(g=>{const covered=g.items.reduce((n,o)=>n+(o.sayfaAdedi||1),0);const kalan=Math.max(0,(g.totalSayfa||0)-covered);if(kalan>0)g.items.push({id:`kalan-${g.kitapId}`,kitapId:g.kitapId,kitapAd:g.kitapAd,aciklama:'Kalan sayfalar',sayfaAdedi:kalan,durum:'bekliyor',isKalan:true})});return Object.values(gruplar).sort((a,b)=>zaman(a.items[0]?.olusturulma)-zaman(b.items[0]?.olusturulma));};"
          if old not in s:
              raise SystemExit('Rapor kitapGruplari hedefi bulunamadı')
          p.write_text(s.replace(old,new), encoding='utf-8')

          # 2) Bireysel ödev: consider all books belonging to the student, including legacy topic rows.
          p = Path('screens/OdevEkrani.js')
          s = p.read_text(encoding='utf-8')
          old = " const ogrenciKonulari=o=>konular.filter(k=>k.ogrenciId===o.id&&!konuZatenOdev(k,o.id)).slice(0,2);"
          new = " const ogrenciKonulari=o=>{const kitapIds=kitaplar.filter(k=>k.ogrenciId===o.id).map(k=>k.id);return konular.filter(k=>(k.ogrenciId===o.id||kitapIds.includes(k.kitapId))&&!konuZatenOdev(k,o.id)).sort((a,b)=>String(a.olusturulma||'').localeCompare(String(b.olusturulma||''))).slice(0,2)};"
          # Load the student's books alongside class homework/topics.
          old_load = "const[a,b,c]=await Promise.all([getDocs(query(collection(db,'odevler'),where('sinifId','==',x.id),where('uid','==',uid))),getDocs(query(collection(db,'ogrenciler'),where('sinifId','==',x.id),where('uid','==',uid))),getDocs(query(collection(db,'konular'),where('sinifId','==',x.id),where('uid','==',uid)))])"
          new_load = "const[a,b,c,d]=await Promise.all([getDocs(query(collection(db,'odevler'),where('sinifId','==',x.id),where('uid','==',uid))),getDocs(query(collection(db,'ogrenciler'),where('sinifId','==',x.id),where('uid','==',uid))),getDocs(query(collection(db,'konular'),where('sinifId','==',x.id),where('uid','==',uid))),getDocs(query(collection(db,'kitaplar'),where('sinifId','==',x.id),where('uid','==',uid)))])"
          old_sets = "setKonular(c.docs.map(d=>({id:d.id,...d.data()})).filter(x=>donemUygun(x,donemYili)).sort((a,b)=>(a.olusturulma||'').localeCompare(b.olusturulma||'')))}catch(e)"
          new_sets = "setKonular(c.docs.map(d=>({id:d.id,...d.data()})).filter(x=>donemUygun(x,donemYili)).sort((a,b)=>(a.olusturulma||'').localeCompare(b.olusturulma||'')));setKitaplar(d.docs.map(d=>({id:d.id,...d.data()})).filter(x=>donemUygun(x,donemYili)))}catch(e)"
          if old not in s or old_load not in s or old_sets not in s:
              raise SystemExit('Odev hedeflerinden biri bulunamadı')
          s=s.replace(old,new).replace(old_load,new_load).replace(old_sets,new_sets)
          # Add kitaplar state if absent.
          old_state = "const[siniflar,setSiniflar]=useState([]),[secili,setSecili]=useState"
          new_state = "const[siniflar,setSiniflar]=useState([]),[kitaplar,setKitaplar]=useState([]),[secili,setSecili]=useState"
          if old_state not in s:
              raise SystemExit('Odev state hedefi bulunamadı')
          s=s.replace(old_state,new_state).replace(old,new)
          p.write_text(s, encoding='utf-8')

          # 4) Password change: require the new password twice and block mismatches.
          p = Path('screens/SifreDegistirEkrani.js')
          s = p.read_text(encoding='utf-8')
          s=s.replace("const[eski,setEski]=useState(''),[yeni,setYeni]=useState(''),[loading,setLoading]=useState(false);", "const[eski,setEski]=useState(''),[yeni,setYeni]=useState(''),[yeniTekrar,setYeniTekrar]=useState(''),[loading,setLoading]=useState(false);")
          s=s.replace("if(!eski||!yeni)return Alert.alert('Eksik bilgi','Eski ve yeni şifre alanlarını doldurun.');if(yeni.length<6)", "if(!eski||!yeni||!yeniTekrar)return Alert.alert('Eksik bilgi','Eski şifre, yeni şifre ve yeni şifre tekrar alanlarını doldurun.');if(yeni!==yeniTekrar)return Alert.alert('Hata','Yeni şifreler eşleşmiyor.');if(yeni.length<6)")
          s=s.replace("<Text style={s.label}>Yeni şifre</Text><TextInput style={s.input} value={yeni} onChangeText={setYeni} secureTextEntry placeholder=\"Yeni şifreniz\"/>", "<Text style={s.label}>Yeni şifre</Text><TextInput style={s.input} value={yeni} onChangeText={setYeni} secureTextEntry placeholder=\"Yeni şifreniz\"/><Text style={s.label}>Yeni şifre tekrar</Text><TextInput style={s.input} value={yeniTekrar} onChangeText={setYeniTekrar} secureTextEntry placeholder=\"Yeni şifrenizi tekrar yazın\"/>")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screens/RaporEkrani.js screens/OdevEkrani.js screens/SifreDegistirEkrani.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply requested AjandaPro fixes"
          git push
