name: Fix three reported issues

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor == 'optisinav-svg' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Homework table: force two truly equal columns and prevent text intrinsic width from changing layout.
          p = Path('screens/OdevEkrani.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              "studentRow:{flexDirection:'row',paddingVertical:9,borderBottomWidth:1,borderBottomColor:'#eee',alignItems:'center'},statusName:{width:'50%',flexGrow:0,flexShrink:0,flexBasis:'50%'},statusValue:{width:'50%',flexGrow:0,flexShrink:0,flexBasis:'50%',textAlign:'center'},",
              "studentRow:{width:'100%',flexDirection:'row',paddingVertical:9,borderBottomWidth:1,borderBottomColor:'#eee',alignItems:'center'},statusName:{flex:1,width:'50%',minWidth:0,flexBasis:0,paddingRight:8},statusValue:{flex:1,width:'50%',minWidth:0,flexBasis:0,textAlign:'center'},"
          )
          p.write_text(s, encoding='utf-8')

          # 2) Student report: make attendance matching tolerant of older/newer records and always show a status line.
          p = Path('screens/RaporEkrani.js')
          s = p.read_text(encoding='utf-8')
          old_start = " const studentTopics=id=>{"
          old_end = " const konuOdevDurumu=k=>"
          a = s.find(old_start)
          b = s.find(old_end, a)
          if a < 0 or b < 0:
              raise SystemExit('studentTopics block not found')
          new_block = ''' const studentTopics=id=>{const dersKonular=notlar.map(n=>{const ayniTarih=v=>String(v?.tarih||'').slice(0,10)===String(n.tarih||'').slice(0,10);const ayniSaat=v=>(!n.baslangicSaat||!v.baslangicSaat||v.baslangicSaat===n.baslangicSaat)&&(!n.bitisSaat||!v.bitisSaat||v.bitisSaat===n.bitisSaat);let y=null;if(n.oturumId)y=yoklamalar.find(v=>v.ogrenciId===id&&v.oturumId===n.oturumId);if(!y&&n.dersId)y=yoklamalar.find(v=>v.ogrenciId===id&&v.dersId===n.dersId&&ayniTarih(v));if(!y)y=yoklamalar.find(v=>v.ogrenciId===id&&ayniTarih(v)&&n.sinifId&&v.sinifId===n.sinifId&&v.dersEtiketi&&n.baslangicSaat&&n.bitisSaat&&ayniSaat(v));if(!y){const gunluk=yoklamalar.filter(v=>v.ogrenciId===id&&ayniTarih(v));if(gunluk.length===1)y=gunluk[0]}return{id:'not-'+n.id,ad:n.not||'İşlenen konu',kitapAd:n.kitapAd||'',tarih:n.tarih,tarihGosterim:n.tarihGosterim,olusturulma:n.olusturulma,dersteYok:y?.durum==='gelmedi',yoklamaDurumu:y?.durum||null}});return{ders:dersKonular.sort((a,b)=>zaman(b.olusturulma||b.tarih)-zaman(a.olusturulma||a.tarih))};};
'''
          s = s[:a] + new_block + s[b:]
          old_render = "{k.yoklamaDurumu==='gelmedi'?<Text style={s.absent}>❌ Derste yok</Text>:k.yoklamaDurumu==='gecikti'?<Text style={s.late}>⏰ Derste geç geldi</Text>:k.yoklamaDurumu==='geldi'?<Text style={s.present}>✅ Derste var</Text>:null}"
          new_render = "{k.yoklamaDurumu==='gelmedi'?<Text style={s.absent}>❌ Derste yok</Text>:k.yoklamaDurumu==='gecikti'?<Text style={s.late}>⏰ Derste geç geldi</Text>:k.yoklamaDurumu==='geldi'?<Text style={s.present}>✅ Derste var</Text>:<Text style={s.unknown}>⚪ Yoklama bilgisi bulunamadı.</Text>}"
          if old_render not in s:
              raise SystemExit('report attendance render not found')
          s = s.replace(old_render, new_render)
          s = s.replace("absent:{color:'#C62828',fontSize:11,fontWeight:'bold',marginTop:5}});", "absent:{color:'#C62828',fontSize:11,fontWeight:'bold',marginTop:5},unknown:{color:'#757575',fontSize:11,fontWeight:'bold',marginTop:5}});")
          p.write_text(s, encoding='utf-8')

          # 3) Calendar: replace the fragile nested vertical ScrollViews with a reliable up/down time control.
          p = Path('screens/TakvimEkrani.js')
          s = p.read_text(encoding='utf-8')
          start = s.find('function Roller({label,value,onChange}){')
          end = s.find('export default function TakvimEkrani', start)
          if start < 0 or end < 0:
              raise SystemExit('Roller block not found')
          new_roller = '''function Roller({label,value,onChange}){const[h,m]=String(value||'09:00').split(':').map(Number);const mins=Array.from({length:12},(_,i)=>i*5);const changeHour=d=>onChange(`${pad((h+d+24)%24)}:${pad(m)}`);const changeMinute=d=>{const i=mins.indexOf(m)<0?0:mins.indexOf(m);const ni=(i+d+mins.length)%mins.length;onChange(`${pad(h)}:${pad(mins[ni])}`)};return <View style={s.rollerBox}><Text style={s.label}>{label}</Text><View style={s.clockPicker}><View style={s.clockCol}><TouchableOpacity style={s.clockArrow} onPress={()=>changeHour(1)}><Text style={s.clockArrowT}>▲</Text></TouchableOpacity><Text style={s.clockValue}>{pad(h)}</Text><TouchableOpacity style={s.clockArrow} onPress={()=>changeHour(-1)}><Text style={s.clockArrowT}>▼</Text></TouchableOpacity><Text style={s.clockHint}>Saat</Text></View><Text style={s.clockColon}>:</Text><View style={s.clockCol}><TouchableOpacity style={s.clockArrow} onPress={()=>changeMinute(1)}><Text style={s.clockArrowT}>▲</Text></TouchableOpacity><Text style={s.clockValue}>{pad(m)}</Text><TouchableOpacity style={s.clockArrow} onPress={()=>changeMinute(-1)}><Text style={s.clockArrowT}>▼</Text></TouchableOpacity><Text style={s.clockHint}>Dakika</Text></View></View><Text style={s.clockHelp}>▲ / ▼ ile ayarla • Dakika 5'er dakika ilerler</Text></View>}
'''
          s = s[:start] + new_roller + s[end:]
          old_styles = "rollerBox:{marginTop:10},digital:{flexDirection:'row',alignItems:'center',justifyContent:'center',backgroundColor:'#111',borderRadius:14,padding:8},roller:{width:92,height:142,alignItems:'center'},arrowBtn:{height:30,width:92,alignItems:'center',justifyContent:'center'},arrowT:{color:'#fff',fontSize:17},valueWindow:{height:82,width:92,alignItems:'center',justifyContent:'center'},near:{height:24,fontSize:18,color:'#666',lineHeight:24},current:{height:34,fontSize:28,color:'#fff',fontWeight:'bold',lineHeight:34},colon:{fontSize:30,color:'#fff',paddingHorizontal:5},"
          new_styles = "rollerBox:{marginTop:10},clockPicker:{flexDirection:'row',alignItems:'center',justifyContent:'center',backgroundColor:'#111',borderRadius:16,paddingVertical:10,paddingHorizontal:18},clockCol:{width:92,alignItems:'center'},clockArrow:{width:70,height:34,borderRadius:9,backgroundColor:'#263238',alignItems:'center',justifyContent:'center'},clockArrowT:{color:'#fff',fontSize:18,fontWeight:'bold'},clockValue:{width:82,height:58,textAlign:'center',textAlignVertical:'center',fontSize:36,fontWeight:'bold',color:'#fff',marginVertical:4},clockHint:{fontSize:10,color:'#B0BEC5',marginTop:4},clockColon:{fontSize:34,color:'#fff',fontWeight:'bold',paddingHorizontal:8},clockHelp:{fontSize:10,color:'#777',textAlign:'center',marginTop:5},"
          if old_styles not in s:
              raise SystemExit('old time styles not found')
          s = s.replace(old_styles, new_styles)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate changed files
        run: |
          node -e "require('@babel/parser').parse(require('fs').readFileSync('screens/OdevEkrani.js','utf8'),{sourceType:'module',plugins:['jsx']}); require('@babel/parser').parse(require('fs').readFileSync('screens/RaporEkrani.js','utf8'),{sourceType:'module',plugins:['jsx']}); require('@babel/parser').parse(require('fs').readFileSync('screens/TakvimEkrani.js','utf8'),{sourceType:'module',plugins:['jsx']}); console.log('JSX syntax OK')"

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screens/OdevEkrani.js screens/RaporEkrani.js screens/TakvimEkrani.js .github/workflows/fix-three-reported-issues.yml
          git commit -m "Fix homework columns, report attendance, and time picker"
          git push origin main
          git rm .github/workflows/fix-three-reported-issues.yml
          git commit -m "Remove temporary repair workflow"
          git push origin main
